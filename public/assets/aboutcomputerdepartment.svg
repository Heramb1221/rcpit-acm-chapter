<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#111214"/>
      <stop offset="1" stop-color="#1c2226"/>
    </linearGradient>

    <!-- subtle glass shine -->
    <linearGradient id="gloss" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="rgba(255,255,255,0.03)"/>
      <stop offset="0.6" stop-color="rgba(255,255,255,0.01)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>

    <!-- soft vignette -->
    <radialGradient id="vign" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="rgba(0,0,0,0)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0.35)"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#vign)"/>

  <!-- Plate border -->
  <rect x="40" y="40" width="1120" height="720" rx="12" ry="12" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- gloss -->
  <rect x="48" y="48" width="1104" height="120" rx="10" fill="url(#gloss)" />

  <!-- Top small line -->
  <text x="600" y="110" text-anchor="middle" fill="#dfe6ea" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="600" letter-spacing="1">
    The Shirpur Education Society's
  </text>

  <!-- Institute line (wrap) -->
  <text x="600" y="170" text-anchor="middle" fill="#ffffff" font-family="Arial Black, Impact, sans-serif" font-size="48" font-weight="900" letter-spacing="1">
    R.C.Patel Institute of Technology, Shirpur
  </text>

  <!-- COMPUTER CENTER heading -->
  <text x="600" y="245" text-anchor="middle" fill="#ffffff" font-family="Arial Black, Impact, sans-serif" font-size="78" font-weight="900" letter-spacing="3">
    COMPUTER CENTER
  </text>

  <!-- subheading -->
  <text x="600" y="310" text-anchor="middle" fill="#e6e9ea" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="600" letter-spacing="0.5">
    Inaugurated by auspicious hands of
  </text>

  <!-- Gold highlighted name -->
  <text x="600" y="370" text-anchor="middle" fill="#D4A017" font-family="Arial Black, Impact, sans-serif" font-size="46" font-weight="800" letter-spacing="0.8">
    Padmashree Dr. Vijay Bhatkar
  </text>

  <!-- description for first person (smaller) -->
  <text x="600" y="410" text-anchor="middle" fill="#e6e9ea" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="600">
    (Chairman, ETH Research Lab, Pune &amp; Former Executive Director, C-Dac, Pune)
  </text>

  <!-- presence line -->
  <text x="600" y="460" text-anchor="middle" fill="#e6e9ea" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700">
    In Presence of
  </text>

  <!-- second gold highlighted name -->
  <text x="600" y="520" text-anchor="middle" fill="#D4A017" font-family="Arial Black, Impact, sans-serif" font-size="48" font-weight="800" letter-spacing="0.6">
    Shri. Amrishbhai Patel
  </text>

  <!-- description for second person (split onto two lines) -->
  <text x="600" y="560" text-anchor="middle" fill="#e6e9ea" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="600">
    (President, The Shirpur Education Society, Shirpur &amp;
  </text>
  <text x="600" y="585" text-anchor="middle" fill="#e6e9ea" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="600">
    Former Cabinet Minister, Maharashtra State)
  </text>

  <!-- date block -->
  <g transform="translate(0, 20)">
    <text x="600" y="660" text-anchor="middle" fill="#e6e9ea" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700">
      On
    </text>

    <text x="600" y="705" text-anchor="middle" fill="#ffffff" font-family="Arial Black, Impact, sans-serif" font-size="34" font-weight="800" letter-spacing="1">
      Saturday, October 8, 2005
    </text>
  </g>

  <!-- subtle reflections (decorative) -->
  <g opacity="0.06">
    <ellipse cx="250" cy="540" rx="260" ry="60" fill="#ffffff" transform="rotate(-6 250 540)"/>
    <ellipse cx="900" cy="460" rx="220" ry="50" fill="#ffffff" transform="rotate(8 900 460)"/>
  </g>

  <!-- small screws in corners -->
  <circle cx="60" cy="60" r="6" fill="#cfcfcf" opacity="0.85"/>
  <circle cx="1140" cy="60" r="6" fill="#cfcfcf" opacity="0.85"/>
  <circle cx="60" cy="740" r="6" fill="#cfcfcf" opacity="0.85"/>
  <circle cx="1140" cy="740" r="6" fill="#cfcfcf" opacity="0.85"/>
</svg>